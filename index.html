<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personalised book recommendation tool">
    <title>Book Recommendation App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Find Your Next Book</h1>
    </header>
    <main>
        <section id="preference-form">
            <h2>Your Preferences</h2>
            <form id="book-form">
                <div class="form-group">
                    <label for="genre">Genre:</label>
                    <select id="genre" name="genre">
                        <option value="">Any</option>
                        <option value="fiction">Fiction</option>
                        <option value="non-fiction">Non-Fiction</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="mystery">Mystery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" placeholder="e.g., Richard Osman ">
                        <option value="jeremy renner">Jeremy Renner</option>
                        <option value="richard osman">Richard Osman</option>
                        <option value="mojang ab">Mojang AB</option>
                        <option value="christelle dabos">Christelle Dabos</option>


                </div>

                <div class="form-group">
                    <label for="price">Max Price (£):</label>
                    <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g., 20">
                </div>

                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language">
                        <option value="">Any</option>
                        <option value="english">English</option>
                        <option value="french">French</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="format">Format:</label>
                    <select id="format" name="format">
                        <option value="">Any</option>
                        <option value="hardcover">Hardcover</option>
                        <option value="paperback">Paperback</option>
                    </select>
                </div>

                <button type="submit">Find Books</button>
            </form>
        </section>

        <section id="results">
            <h2>Recommendations</h2>
            <div id="book-list"></div>
        </section>

        <section id="wishlist">
            <h2>Your Wishlist</h2>
            <div id="wishlist-list"></div>
        </section>
    </main>
    <footer>
    </footer>
    <script src="script.js"></script>
</body>
</html>
